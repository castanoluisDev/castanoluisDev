name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

# Every run of this workflow has failed since it was added, and this block is
# why: the generation step (Platane/snk) always succeeded, and the step that
# PUBLISHES the result to the `output` branch always failed. GitHub's default
# GITHUB_TOKEN is read-only, so the push came back 403 and the branch was never
# created — which is why the README's snake has always been a broken image.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Publishing by hand instead of through a third-party action. The README
      # this feeds had three broken images because it leaned on services that
      # went away, and the publish step is the one place here that does not need
      # to lean on anything: six git commands with the token GitHub already gave
      # us.
      - name: Publish to the output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "chore: regenerate the contribution snake"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:output
