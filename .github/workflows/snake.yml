name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

# Necesario para empujar la rama `output`: el GITHUB_TOKEN por defecto es de
# solo lectura. No era, sin embargo, la razón por la que este workflow llevaba
# fallando desde que se creó — ver el paso de publicación.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # La causa real, leída en el log de la corrida del 2026-08-24:
      #
      #   /home/runner/work/.../dist/.git: Permission denied
      #
      # `Platane/snk` es una action de contenedor y corre como root, así que el
      # `dist/` que crea queda con dueño root y el usuario del runner (uid 1001)
      # no puede escribir dentro. Por eso `git init` moría ahí, y por eso la
      # rama `output` nunca existió y la imagen del README daba 404 — la snake
      # sí se generaba, el paso anterior siempre terminó en éxito.
      #
      # Se copia a un directorio que el runner sí posee, en vez de pedir sudo
      # para adueñarse del de root: leer de dist funciona, escribir no.
      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          cp dist/*.svg out/
          ls -l out
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "chore: regenerate the contribution snake"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:output
