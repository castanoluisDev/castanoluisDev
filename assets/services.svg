<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Six services: UX/UI design, frontend development, AI-powered apps, design systems, vibe coding and consulting">
  <title>Servicios</title>
  <defs>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2439"/>
      <stop offset="1" stop-color="#0b1c2e"/>
    </linearGradient>
    <linearGradient id="topRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0.12"/>
    </linearGradient>
    <style>
      .n  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; letter-spacing: 1.6px; fill: #00d4ff; }
      .t  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.8px; fill: #0a192f; }
      .d  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #c9d1d9; }
    </style>
  </defs>

  <rect width="1000" height="470" fill="none"/>

  <!-- Six cards, 3 x 2. The title sits on a CYAN plate with NAVY letters: 9.94:1.
       It used to be white on that same cyan, which measures 1.77:1 — the reported
       "casi no se ve". Same two colours, swapped. -->

  <!-- 01 -->
  <g transform="translate(0 0)">
    <rect x="0" y="0" width="320" height="215" rx="14" fill="url(#cardFill)" stroke="#00d4ff" stroke-opacity="0.20"/>
    <rect x="14" y="0" width="120" height="2" rx="1" fill="url(#topRule)"/>
    <text class="n" x="24" y="42">01</text>
    <rect x="22" y="60" width="192" height="30" rx="6" fill="#00d4ff"/>
    <text class="t" x="34" y="80">UX/UI DESIGN</text>
    <text class="d" x="24" y="124">Interfaces intuitivas y atractivas,</text>
    <text class="d" x="24" y="145">centradas en el usuario con</text>
    <text class="d" x="24" y="166">Design Thinking.</text>
  </g>

  <!-- 02 -->
  <g transform="translate(340 0)">
    <rect x="0" y="0" width="320" height="215" rx="14" fill="url(#cardFill)" stroke="#00d4ff" stroke-opacity="0.20"/>
    <rect x="14" y="0" width="120" height="2" rx="1" fill="url(#topRule)"/>
    <text class="n" x="24" y="42">02</text>
    <rect x="22" y="60" width="196" height="30" rx="6" fill="#00d4ff"/>
    <text class="t" x="34" y="80">FRONTEND DEV</text>
    <text class="d" x="24" y="124">Aplicaciones web modernas,</text>
    <text class="d" x="24" y="145">rápidas y 100 % responsivas.</text>
  </g>

  <!-- 03 -->
  <g transform="translate(680 0)">
    <rect x="0" y="0" width="320" height="215" rx="14" fill="url(#cardFill)" stroke="#00d4ff" stroke-opacity="0.20"/>
    <rect x="14" y="0" width="120" height="2" rx="1" fill="url(#topRule)"/>
    <text class="n" x="24" y="42">03</text>
    <rect x="22" y="60" width="222" height="30" rx="6" fill="#00d4ff"/>
    <text class="t" x="34" y="80">AI-POWERED APPS</text>
    <text class="d" x="24" y="124">Experiencias inteligentes</text>
    <text class="d" x="24" y="145">potenciadas con inteligencia</text>
    <text class="d" x="24" y="166">artificial.</text>
  </g>

  <!-- 04 -->
  <g transform="translate(0 255)">
    <rect x="0" y="0" width="320" height="215" rx="14" fill="url(#cardFill)" stroke="#00d4ff" stroke-opacity="0.20"/>
    <rect x="14" y="0" width="120" height="2" rx="1" fill="url(#topRule)"/>
    <text class="n" x="24" y="42">04</text>
    <rect x="22" y="60" width="216" height="30" rx="6" fill="#00d4ff"/>
    <text class="t" x="34" y="80">DESIGN SYSTEMS</text>
    <text class="d" x="24" y="124">Sistemas de diseño escalables</text>
    <text class="d" x="24" y="145">y consistentes para equipos.</text>
  </g>

  <!-- 05 -->
  <g transform="translate(340 255)">
    <rect x="0" y="0" width="320" height="215" rx="14" fill="url(#cardFill)" stroke="#00d4ff" stroke-opacity="0.20"/>
    <rect x="14" y="0" width="120" height="2" rx="1" fill="url(#topRule)"/>
    <text class="n" x="24" y="42">05</text>
    <rect x="22" y="60" width="176" height="30" rx="6" fill="#00d4ff"/>
    <text class="t" x="34" y="80">VIBE CODING</text>
    <text class="d" x="24" y="124">Desarrollo acelerado con</text>
    <text class="d" x="24" y="145">herramientas de IA de última</text>
    <text class="d" x="24" y="166">generación.</text>
  </g>

  <!-- 06 -->
  <g transform="translate(680 255)">
    <rect x="0" y="0" width="320" height="215" rx="14" fill="url(#cardFill)" stroke="#00d4ff" stroke-opacity="0.20"/>
    <rect x="14" y="0" width="120" height="2" rx="1" fill="url(#topRule)"/>
    <text class="n" x="24" y="42">06</text>
    <rect x="22" y="60" width="160" height="30" rx="6" fill="#00d4ff"/>
    <text class="t" x="34" y="80">CONSULTING</text>
    <text class="d" x="24" y="124">Asesoría en UX, estrategia</text>
    <text class="d" x="24" y="145">digital y mejores prácticas</text>
    <text class="d" x="24" y="166">de frontend.</text>
  </g>
</svg>
